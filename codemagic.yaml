workflows:
  flet-android-workflow:
    name: Flet Android APK Build
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      groups:
        - python
      vars:
        FLET_VERSION: "0.85.3"
    scripts:
      - name: Initialize Environment and Dependencies
        script: |
          pip install flet==$FLET_VERSION mysql-connector-python
      - name: Execute Flet Native Android Build
        script: |
          # ✅ FIX: Dynamically bundles files into a standard structure
          mkdir -p src
          mv -f mobile_monitor.py src/main.py
          mv -f flet.yaml src/
          
          # Automatically passes the yes confirmation hook
          yes | flet build apk src
    artifacts:
      - src/build/apk/*.apk
